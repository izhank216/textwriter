[package]
name = "textwriter"
version = "0.1.1"
edition = "2021"
license = "MIT"
default-run = "textwriter"

[[bin]]
name = "textwriter"
path = "src/main.rs"
required-features = ["linux_build"]

[[bin]]
name = "textwriter-windows"
path = "src/windows/main.rs"
required-features = ["windows_build"]

[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = "0.8"
glib = "0.19"
gio = "0.19"

[target.'cfg(target_os = "windows")'.dependencies]
native-windows-gui = "1.0.13"
native-windows-derive = "1.0.5"

[features]
linux_build = []
windows_build = []
